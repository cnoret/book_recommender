name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t next-chapter .

      - name: Start the container and wait until it is healthy
        run: |
          docker run -d --name app -p 7860:7860 next-chapter
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "Health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs app
          exit 1

      - name: Check that the app answers
        run: curl --fail --silent http://localhost:7860/_stcore/health
